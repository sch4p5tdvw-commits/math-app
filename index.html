<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>さんすうチャレンジ</title>
<meta name="description" content="スマホでタップして遊べる さんすうドリルアプリ">
<meta name="theme-color" content="#ff8a3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="さんすう">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1 class="app-title">🧮 さんすうチャレンジ</h1>

  <!-- あいことば画面 -->
  <section id="screen-group" class="screen" hidden>
    <div class="card">
      <h2>あいことばを いれてね</h2>
      <p class="group-note">
        おなじ あいことばを いれた スマホや タブレットで、きろくを いっしょに つかえます。
        かぞくで きめた あいことばを いれてね。
      </p>
      <form id="group-form" class="name-entry" autocomplete="off">
        <input type="text" id="group-code-input" class="name-input" maxlength="20" placeholder="あいことば" required>
        <button type="submit" class="btn btn-primary">けってい</button>
      </form>
    </div>
  </section>

  <!-- プレイヤーとうろく画面 -->
  <section id="screen-player" class="screen" hidden>
    <div class="card">
      <h2>なまえを とうろくしてね</h2>
      <div id="player-list" class="player-list"></div>
      <form id="player-form" class="name-entry" autocomplete="off">
        <input type="text" id="player-name-input" class="name-input" maxlength="10" placeholder="あたらしいなまえ（10もじまで）" required>
        <button type="submit" class="btn btn-primary">とうろくする</button>
      </form>
    </div>
  </section>

  <!-- スタート画面 -->
  <section id="screen-start" class="screen" hidden>
    <div class="card player-bar">
      <span id="player-display"></span>
      <button type="button" id="btn-switch-player" class="btn-link">ちがうひとであそぶ</button>
    </div>
    <div class="group-bar">
      <span id="group-display"></span>
      <button type="button" id="btn-change-group" class="btn-link">あいことばをかえる</button>
    </div>

    <div class="card">
      <h2>レベルをえらんでね</h2>
      <div class="level-grid" id="level-grid"></div>

      <h2>モードをえらんでね</h2>
      <div class="mode-grid">
        <label class="mode-chip">
          <input type="radio" name="mode" value="normal" checked>
          <span>もんだいすうモード</span>
          <select id="question-count">
            <option value="30" selected>30もん</option>
            <option value="50">50もん</option>
            <option value="100">100もん</option>
          </select>
        </label>
        <label class="mode-chip">
          <input type="radio" name="mode" value="timeattack">
          <span>タイムアタック</span>
          <select id="time-limit">
            <option value="30">30びょう</option>
            <option value="60" selected>60びょう</option>
            <option value="120">120びょう</option>
          </select>
        </label>
      </div>

      <button id="btn-start" class="btn btn-primary">スタート！</button>
    </div>

    <div class="card">
      <div class="ranking-header">
        <h2>ランキング</h2>
        <select id="ranking-level-filter" class="filter-select">
          <option value="1">レベル1</option>
          <option value="2">レベル2</option>
          <option value="3">レベル3</option>
          <option value="4">レベル4</option>
          <option value="5">レベル5</option>
          <option value="6">レベル6</option>
          <option value="7">レベル7</option>
          <option value="8">レベル8</option>
        </select>
      </div>
      <h3 class="ranking-subhead">もんだいすうモード（はやさじゅん）</h3>
      <div id="ranking-normal-list" class="history-list"></div>

      <h3 class="ranking-subhead">タイムアタック（せいかいすうじゅん）</h3>
      <div id="ranking-timeattack-list" class="history-list"></div>
    </div>
  </section>

  <!-- 問題画面 -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="card quiz-card">
      <div class="quiz-status">
        <span id="quiz-progress">もんだい 1/10</span>
        <span id="quiz-timer"></span>
      </div>
      <div class="quiz-score">せいかい: <span id="quiz-correct">0</span> ／ まちがい: <span id="quiz-wrong">0</span></div>

      <div id="quiz-question" class="quiz-question">1 + 1 = ?</div>

      <div id="answer-display" class="answer-display" aria-live="polite">&nbsp;</div>

      <div class="keypad" id="keypad">
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-back" data-key="back">⌫</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key key-enter" data-key="enter">こたえる</button>
      </div>
      <div id="quiz-feedback" class="quiz-feedback"></div>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen" hidden>
    <div class="card">
      <h2 id="result-title">けっか</h2>
      <div class="result-stats" id="result-stats"></div>

      <button id="btn-retry" class="btn btn-primary">もういちど</button>
      <button id="btn-back" class="btn btn-secondary">さいしょの がめんへ</button>
    </div>
  </section>
</div>

<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
