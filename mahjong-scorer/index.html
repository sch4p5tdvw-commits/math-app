<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>麻雀スコア計算</title>
<meta name="description" content="4人以上6人以下のメンバーで回し打ちしながら使える、麻雀の点数計算・記録アプリ">
<meta name="theme-color" content="#0b5d3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻雀スコア">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ================= セットアップ画面 ================= -->
  <section id="screen-setup" class="screen">
    <div class="card">
      <h1 class="app-title">麻雀スコア計算</h1>
      <p class="lead">4〜6人のメンバーを登録してください。5人・6人のときは1半荘ごとに1〜2人が待機し、回し打ちで交代しながら遊べます。</p>

      <h2 class="section-title">メンバー（4〜6人）</h2>
      <div id="setup-player-list" class="setup-player-list"></div>
      <form id="setup-player-form" class="inline-form" autocomplete="off">
        <input type="text" id="setup-player-input" class="text-input" maxlength="8" placeholder="なまえ（8文字まで）">
        <button type="submit" class="btn btn-secondary">追加</button>
      </form>

      <h2 class="section-title">持ち点</h2>
      <div class="setting-row">
        <label for="setup-start-points">開始時の持ち点</label>
        <input type="number" id="setup-start-points" class="number-input" value="25000" step="1000" min="0">
      </div>

      <h2 class="section-title">ルール</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="setup-kiriage">
        <span>切り上げ満貫を使う（4翻30符・3翻60符を満貫扱い）</span>
      </label>

      <p id="setup-error" class="error-text" hidden></p>
      <button id="setup-start-btn" class="btn btn-primary btn-block">対局を始める</button>

      <div id="setup-resume" class="resume-box" hidden>
        <p>前回の対局が保存されています。</p>
        <button id="resume-btn" class="btn btn-secondary btn-block">前回の続きから再開する</button>
      </div>

      <button id="setup-archive-btn" class="btn btn-link">過去の記録・通算成績を見る</button>
    </div>
  </section>

  <!-- ================= メイン卓画面 ================= -->
  <section id="screen-table" class="screen" hidden>
    <div class="table-header">
      <div class="round-info">
        <span id="round-label" class="round-label">東1局</span>
        <span id="honba-label" class="honba-label">0本場</span>
      </div>
      <div class="pot-info">
        供託 <span id="pot-label">0</span>点
      </div>
      <button id="menu-btn" class="icon-btn" aria-label="メニュー">☰</button>
    </div>

    <div id="seat-grid" class="seat-grid"></div>

    <div id="waiting-box" class="waiting-box" hidden>
      <h3 class="section-title small">待機中（タップで交代）</h3>
      <div id="waiting-list" class="waiting-list"></div>
      <p class="hint-text">待機中のメンバーを選んでから、交代させたい席をタップしてください。</p>
    </div>

    <div class="action-grid">
      <button id="btn-ron" class="btn btn-action">ロン</button>
      <button id="btn-tsumo" class="btn btn-action">ツモ</button>
      <button id="btn-draw" class="btn btn-action">流局</button>
      <button id="btn-adjust" class="btn btn-action btn-action-sub">点数調整</button>
      <button id="btn-add-player" class="btn btn-action btn-action-sub">メンバー追加</button>
      <button id="btn-undo" class="btn btn-action btn-action-sub" disabled>ひとつ戻す</button>
    </div>

    <button id="btn-history" class="btn btn-link">記録・順位表を見る</button>
  </section>

  <!-- ================= 記録・順位表 画面 ================= -->
  <section id="screen-history" class="screen" hidden>
    <div class="card">
      <div class="row-between">
        <h2 class="section-title">順位表</h2>
        <button id="history-back-btn" class="btn btn-secondary">卓に戻る</button>
      </div>
      <div id="leaderboard" class="leaderboard"></div>

      <h2 class="section-title">対局記録（1局ごと）</h2>
      <div id="history-list" class="history-list"></div>

      <button id="history-archive-btn" class="btn btn-secondary btn-block">過去の記録・通算成績を見る</button>
      <button id="end-session-btn" class="btn btn-danger btn-block">対局を終了する</button>
    </div>
  </section>

  <!-- ================= 過去の記録・通算成績 画面 ================= -->
  <section id="screen-archive" class="screen" hidden>
    <div class="card">
      <div class="row-between">
        <h2 class="section-title">通算成績</h2>
        <button id="archive-back-btn" class="btn btn-secondary">戻る</button>
      </div>
      <div id="stats-table" class="leaderboard"></div>

      <h2 class="section-title">過去の対局</h2>
      <div id="archive-list" class="archive-list"></div>

      <button id="archive-import-btn" class="btn btn-secondary btn-block">スプレッドシートから読み込む</button>
      <button id="archive-clear-btn" class="btn btn-danger btn-block">過去の記録をすべて削除</button>
    </div>
  </section>

  <!-- ================= 手入力モーダル ================= -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal-box" class="modal-box"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
